# The site on GitHub Pages: site/build.mjs reads this repository's releases through the API, the notes in notes/ and
# the charts in data/bench.json, and the page goes out. Releases come from the private super-repo (cli-release.yml,
# vscode-release.yml) with a token, so their events start this workflow; a push here (notes, data, the site) too.
#
# A release's event runs on its tag, and Pages keeps serving what main deployed (a deployment from the tag reports
# success and changes nothing). So the release only asks for a build on main and names its tag, which that build waits
# for: on its own event the API may not list the release yet.
name: pages

on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
    inputs:
      expect:
        description: A release tag the build waits for until the API lists it
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'release' && 'release' || 'build' }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f expect="$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.action != 'deleted' && github.event.release.tag_name || '' }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test site/build.test.mjs
      - run: node site/build.mjs --out _site ${EXPECT:+--expect "$EXPECT"}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECT: ${{ inputs.expect }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
